name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: python -m py_compile dhlotto45/app/*.py
      - name: Shell check
        run: bash -n dhlotto45/run.sh
      - name: Unit tests
        working-directory: dhlotto45/tests
        run: |
          python -X utf8 test_pension.py
          python -X utf8 test_dashboard.py
          python -X utf8 test_purchase_guard.py

  secret-scan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 현재 파일 전체(API 키·토큰·비밀번호·사설 IP)
      - name: gitleaks (current files)
        run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.18.4
          detect --no-git --source=/repo --config=/repo/.gitleaks.toml
          --redact --verbose --no-banner
      # 이번에 올라온 커밋만(예전 기록은 검사 범위에서 제외)
      - name: gitleaks (new commits)
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then
            RANGE="$BASE..HEAD"
          elif [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            RANGE="$BEFORE..HEAD"
          else
            RANGE="HEAD~1..HEAD"
          fi
          echo "scan range: $RANGE"
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0='*' \
            zricethezav/gitleaks:v8.18.4 \
            detect --source=/repo --log-opts="$RANGE" --config=/repo/.gitleaks.toml \
            --redact --verbose --no-banner
