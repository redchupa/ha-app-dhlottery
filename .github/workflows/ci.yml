name: Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r dhlotto45/app/requirements.txt

      - name: Syntax check
        run: python -m compileall -q dhlotto45/app dhlotto45/tests

      - name: Run unit tests
        run: |
          python dhlotto45/tests/test_purchase_guard.py
          python dhlotto45/tests/test_pension.py
          python dhlotto45/tests/test_dashboard.py
          python dhlotto45/tests/test_features.py
