configuration:
  accounts:
    name: 동행복권 계정
    description: >-
      동행복권(dhlottery.co.kr) 아이디·비밀번호. 최대 4개까지 등록되며 위에서부터 Account_1,
      Account_2 … 로 표시됩니다. 아이디는 영문·숫자, 비밀번호는 20자 이하여야 연금복권 구매가 됩니다.
      enabled 를 끄면 그 계정은 건너뜁니다.
  mqtt_url:
    name: MQTT 브로커 주소
    description: >-
      [Mosquitto broker 애드온 사용 시] mqtt://core-mosquitto:1883 그대로 두세요(아래 아이디를 비우면
      주소도 자동으로 맞춰집니다). [다른 기기의 브로커] mqtt://브로커주소:1883 (예: mqtt://mqtt.example.local:1883).
      MQTT 는 필수입니다 — 센서·버튼이 MQTT 로 만들어지므로 Mosquitto broker 애드온과 MQTT 통합이 있어야 합니다.
  mqtt_username:
    name: MQTT 사용자 이름
    description: >-
      [Mosquitto broker 애드온 사용 시 비워 두세요 — 계정을 따로 만들 필요 없음] 비워 두면 Supervisor 가
      Mosquitto 에서 이 애드온 전용 MQTT 계정을 자동으로 발급해 연결합니다(Zigbee2MQTT 등과 같은 방식).
      [직접 입력이 필요한 경우] 다른 기기의 브로커를 쓰거나 특정 계정을 쓰고 싶을 때만 입력하세요. 이때는 먼저
      계정을 만들어야 합니다: 설정 → 사람 → 사용자 추가(예: mqtt_dhlotto, 로그인 허용 끄기 가능) 또는
      Mosquitto broker 구성의 logins 에 추가. 연결이 안 되면 애드온 로그에 이유(예: 인증 거부)가 표시됩니다.
  mqtt_password:
    name: MQTT 비밀번호
    description: >-
      위 MQTT 사용자 이름의 비밀번호. 사용자 이름을 비워 자동 연결을 쓸 때는 비워 두세요.
