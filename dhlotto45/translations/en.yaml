configuration:
  accounts:
    name: DH Lottery accounts
    description: >-
      dhlottery.co.kr username and password. Up to 4 accounts, shown as Account_1, Account_2 …
      in order. Pension720 purchases need a letters/digits username and a password of 20
      characters or fewer. Turn enabled off to skip an account.
  mqtt_url:
    name: MQTT broker URL
    description: >-
      Keep mqtt://core-mosquitto:1883 when you use the Mosquitto broker add-on. For a broker on
      another machine use mqtt://broker-host:1883 (e.g. mqtt://mqtt.example.local:1883).
      Leave the MQTT username empty to use the Mosquitto broker connection details automatically.
  mqtt_username:
    name: MQTT username
    description: >-
      Leave empty for automatic setup (needs the Mosquitto broker add-on; recommended). To enter
      one yourself, first create it: add a dedicated user under Settings → People (e.g.
      mqtt_dhlotto), or add a username/password to the Mosquitto broker add-on's logins option.
  mqtt_password:
    name: MQTT password
    description: >-
      Password for the MQTT username above. Leave empty when using automatic setup.
