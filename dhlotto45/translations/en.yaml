configuration:
  accounts:
    name: DH Lottery accounts
    description: >-
      dhlottery.co.kr username and password. Up to 4 accounts, shown as Account_1, Account_2 …
      in order. Pension720 purchases need a letters/digits username and a password of 20
      characters or fewer. Turn enabled off to skip an account.
  mqtt_url:
    name: MQTT broker URL
    description: >-
      [Mosquitto broker add-on] keep mqtt://core-mosquitto:1883 (with an empty username the address is
      set automatically). [Broker on another machine] mqtt://broker-host:1883 (e.g. mqtt://mqtt.example.local:1883).
      MQTT is required — sensors and buttons are created over MQTT, so the Mosquitto broker add-on and the
      MQTT integration must be set up.
  mqtt_username:
    name: MQTT username
    description: >-
      [Mosquitto broker add-on: leave empty — no account needed] When empty, the Supervisor gets a dedicated
      MQTT account for this add-on from Mosquitto automatically (the same way Zigbee2MQTT and others work).
      [Fill in only] when you use a broker on another machine or want a specific account. Then create the
      account first: Settings → People → add user (e.g. mqtt_dhlotto), or add it to the Mosquitto broker
      logins option. If the connection fails, the add-on log shows why (e.g. authentication refused).
  mqtt_password:
    name: MQTT password
    description: >-
      Password for the MQTT username above. Leave empty when using the automatic connection.
