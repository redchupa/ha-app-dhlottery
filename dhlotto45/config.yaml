name: "DH Lotto 45"
version: "2.11.2"
slug: "dhlotto45"
description: "DH Lottery Lotto 6/45 Add-on with MQTT Discovery - Multi-Account Support"
url: "https://github.com/redchupa/ha-app-dhlottery"
arch:
  - amd64
  - armv7
  - aarch64
init: false
startup: services
boot: auto
ingress: true
ingress_port: 60099
panel_icon: mdi:ticket
panel_title: "DH Lotto 45"
ports:
  60099/tcp: 60099
ports_description:
  60099/tcp: "Web UI and API"
hassio_api: true
hassio_role: default
homeassistant_api: true
auth_api: true
services:
  - mqtt:want
watchdog: "http://[HOST]:[PORT:60099]/health"
options:
  accounts:
    - username: ""
      password: ""
      enabled: true
  mqtt_url: "mqtt://core-mosquitto:1883"
  mqtt_username: ""
  mqtt_password: ""
schema:
  accounts:
    - username: str
      password: password
      enabled: bool?
  mqtt_url: str?
  mqtt_username: str?
  mqtt_password: password?
